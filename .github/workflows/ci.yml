name: CI

on:
  push:
  pull_request:

jobs:
  configurador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: configurador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: ./cad/exportar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: piezas-nido
          path: cad/stl/
